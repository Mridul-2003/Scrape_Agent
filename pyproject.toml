[project]
name = "extract-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mridul.mittal", email = "mridul.mittal@xcelore.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.3",
    "langchain-ollama>=1.0.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "streamlit>=1.66.1",
]

[project.scripts]
extract-data = "extract_data:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
